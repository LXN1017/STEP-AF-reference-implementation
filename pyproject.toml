[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step-af-reference"
version = "0.1.0"
description = "Manuscript-derived reference implementation of STEP-AF"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
step-af = "step_af.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
